                                  - generic [ref=f5e714]: "Chetan: .npmrc Copy Remove spring.application.name=board-nr-persistence server.port=9252 eureka.instance.prefer-ip-address=true logging.file.name=board-nr-persistence.log logging.level.root=info # =============================== # = DATA SOURCE # =============================== # Set here configurations for the database connection # Connection url for the database spring.datasource.url=jdbc:mysql://${SET_FUSION_MYSQL_HOST}:${SET_FUSION_MYSQL_PORT}/board_nr_persistence spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect use.schema.command=USE `board_nr_persistence_%s` spring.datasource.username=${SET_FUSION_MYSQL_USER} spring.datasource.password=${SET_FUSION_MYSQL_PASSWORD} # Keep the connection alive if idle for a long time (needed in production) spring.datasource.testWhileIdle=true spring.datasource.validationQuery=SELECT 1 # HikariCP settings # spring.datasource.hikari.* #60 sec spring.datasource.hikari.connection-timeout=60000 spring.datasource.hikari.minimum-idle=10 spring.datasource.hikari.maximum-pool-size=100 spring.datasource.hikari.idle-timeout=3000 # Connection url for the audit database spring.data.mongodb.uri=mongodb://${SET_FUSION_MONGO_HOST}:${SET_FUSION_MONGO_PORT}/fusion_audit_store # =============================== # = JPA / HIBERNATE # =============================== # Show or not log for each sql query spring.jpa.show-sql=false # Hibernate ddl auto (create, create-drop, update): with \"update\" the database # schema will be automatically updated accordingly to java entities found in # the project spring.jpa.properties.hibernate.hbm2ddl.auto=update spring.jpa.properties.javax.persistence.create-database-schemas=true #spring .jpa.properties.hibernate.show_sql=true #spring .jpa.properties.hibernate.use_sql_comments=true #spring .jpa.properties.hibernate.format_sql=true spring.jpa.properties.hibernate.use-new-id-generator-mappings=false # Naming strategy spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl spring.jackson.mapper.accept_case_insensitive_properties=true spring.jpa.properties.hibernate.jdbc.batch_size=2000 spring.jpa.properties.hibernate.order_inserts=true spring.jpa.properties.hibernate.order_updates=true spring.jpa.properties.hibernate.batch_versioned_data=true spring.main.allow-circular-references=true application.path.lb= application.paths.allowed=/**/v3/swagger-ui/**,/**/v3/api-docs/**,/**/actuator/info,/**/actuator/health,/**/v3/swagger-ui/swagger-ui-bundle.js # =============================== # = JETTY # =============================== jetty.threadPool.minThreads=2 jetty.threadPool.maxThreads=10 fusion.event.service.name=board-nr-persistence fusion.event.producer.configuration.des-event-topic.partition-count=1 fusion.event.producer.configuration.des-event-topic.partition-key-expression=1 server.forward-headers-strategy=framework springdoc.swagger-ui.path=/v3/swagger-ui.html aoplib.aspect.enabled=true pi.common.search.service.name=board pi.common.search.dynamic.mapping.indices=workflowdemo,workflowintro, workflow-execution-runtime, workflow-execution-history, wf_analytics_error, caseprototype07v2nested, users pi.common.search.es.host=${SET_FUSION_ES8_HOST:10.10.2.45} pi.common.search.es.port=${SET_FUSION_ES8_PORT:9200} pi.common.search.es.scheme=${SET_FUSION_ES8_SCHEMA:http} pi.common.search.max.results.limit=1000 management.endpoint.env.show-values=ALWAYS management.health.elasticsearch.enabled=false"
